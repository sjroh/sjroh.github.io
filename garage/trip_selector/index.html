<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trip Selector</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .card {
    background: #111827;
    padding: 24px;
    border-radius: 12px;
    width: 100%;
    max-width: 600px;
  }

  h1 {
    font-size: 20px;
    margin-bottom: 16px;
  }

  .question {
    margin-top: 20px;
    font-weight: bold;
  }

  button {
    margin-top: 10px;
    margin-right: 10px;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #2563eb;
    color: white;
  }

  button:hover {
    background: #1d4ed8;
  }

  .result {
    margin-top: 20px;
    padding: 12px;
    background: #1f2937;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Trip Decision Tree</h1>

  <div id="app"></div>

  <div class="result" id="result"></div>
</div>

<script>
let state = {};

function render() {
  const app = document.getElementById("app");
  const result = document.getElementById("result");
  app.innerHTML = "";
  result.innerHTML = "";

  if (!state.q1) {
    app.innerHTML = `
      <div class="question">Q1. Primary goal?</div>
      <button onclick="select('q1','nature')">Nature</button>
      <button onclick="select('q1','city')">City</button>
      <button onclick="select('q1','chill')">Chill</button>
    `;
    return;
  }

  // NATURAL PATH
  if (state.q1 === "nature") {
    if (!state.q2) {
      app.innerHTML = `
        <div class="question">Q2. Nature intensity?</div>
        <button onclick="select('q2','strong')">Pure Nature</button>
        <button onclick="select('q2','mixed')">Nature + City</button>
      `;
      return;
    }

    if (state.q2 === "strong") {
      result.innerHTML = "Result: Great Smoky Mountains National Park";
      return;
    }

    if (!state.q3) {
      app.innerHTML = `
        <div class="question">Q3. Need city element?</div>
        <button onclick="select('q3','no')">No</button>
        <button onclick="select('q3','yes')">Yes</button>
      `;
      return;
    }

    result.innerHTML = state.q3 === "yes"
      ? "Result: Asheville"
      : "Result: Great Smoky Mountains National Park";
    return;
  }

  // CITY PATH
  if (state.q1 === "city") {
    if (!state.q2) {
      app.innerHTML = `
        <div class="question">Q2. City preference?</div>
        <button onclick="select('q2','history')">History / Museums</button>
        <button onclick="select('q2','casual')">Casual / Walkable</button>
      `;
      return;
    }

    if (state.q2 === "history") {
      result.innerHTML = "Result: Washington D.C.";
      return;
    }

    if (!state.q3) {
      app.innerHTML = `
        <div class="question">Q3. City scale?</div>
        <button onclick="select('q3','big')">Big city ok</button>
        <button onclick="select('q3','small')">Small walkable</button>
      `;
      return;
    }

    result.innerHTML = state.q3 === "big"
      ? "Result: Washington D.C."
      : "Result: Savannah";
    return;
  }

  // CHILL PATH
  result.innerHTML = `
    Result: ${state.q2 === "mixed" ? "Asheville" : "Savannah"}
  `;
}

function select(key, value) {
  state[key] = value;
  render();
}

render();
</script>

</body>
</html>
